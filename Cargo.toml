[package]
authors = ["Toby <toby@tobot.dev>"]
name = "advent-of-code-2024"
version = "24.2.0"
edition = "2021"
default-run = "get_input"

[profile.release]
strip = "symbols"
lto = true
opt-level = 3
codegen-units = 1

[profile.dev.package."*"]
opt-level = 3
codegen-units = 1
[profile.release.package."*"]
opt-level = 3
codegen-units = 1
[profile.release.build-override]
codegen-units = 1

[[bin]]
name = "get_input"
path = "src/get_input.rs"
test = false

[[bin]]
name = "template"
# day00 for alphabetic sorting
path = "day00/main.rs"
test = false

[[bin]]
name = "day01"
path = "day01/main.rs"

[[bin]]
name = "day02"
path = "day02/main.rs"

[dependencies]
reqwest = { version = "0.12.9", features = ["blocking"] }

